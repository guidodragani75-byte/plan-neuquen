name: Sincronización Automática con Google Sheets

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 UTC (03:00 hora de Argentina)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions en GitHub

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar scripts de actualización de métricas y páginas
        run: |
          python scripts/update_metrics.py
          python scripts/generate_pages.py

      - name: Confirmar y subir cambios si hay novedades
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ index.html PLAN_NEUQUEN.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sincronización automática desde Google Sheets [skip ci]" && git push)
